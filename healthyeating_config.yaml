chat_page:
  placeholder: "Ask us anything about food!"
  examples:
    - title: "How do I get started?"
      icon: "Leaf"
      color: "#7C3AED"
      bg_color: "#F5F3FF"
      suggestions:
        - "I know I'm not eating in a healthy way but I don't know what to do about it."
        - "What is clean eating?"
        - "How can I get started eating more vegetables?"
    - title: "Why healthy eating?"
      icon: "Heart"
      color: "#E11D48"
      bg_color: "#FFF1F2"
      suggestions:
        - "Is clean eating really more enjoyable?"
        - "How do real foods improve health?"
        - "What are some benefits of fruit?"
    - title: "Easy food prep"
      icon: "UtensilsCrossed"
      color: "#D97706"
      bg_color: "#FFFBEB"
      suggestions:
        - "What can I pack for lunch?"
        - "What's an easy superfood?"
        - "What do I do with frozen fruit?"
    - title: "The science"
      icon: "FlaskConical"
      color: "#0891B2"
      bg_color: "#ECFEFF"
      suggestions:
        - "How do you know if a food is nutrient dense?"
        - "Why is processed food such a big problem?"
        - "What does it mean for a food to have high enzymes?"

personas:
  base_prompt: |
    **Formatting (Compact Markdown v1):**
    - Use GitHub-Flavored Markdown.
    - Output exactly three sections in this order:
      - `### Thought` -- one sentence that reflects on the user's situation from YOUR perspective.
      - `### What to do` -- exactly 3 bullets, one line each, with practical actions.
      - `### Next step` -- one imperative sentence telling the user what to do now.
    - Use `###` for headings and `-` for bullets.
    - Insert one blank line between sections.
    - Keep each section unique and non-repetitive.

    **Domain (Healthy Eating Advisor by Heidi Boudro):**
    - Mission: introduce easy clean eating and real food.
    - Audience: people who want to change or improve their diet.
    - Prefer practical, nonjudgmental, encouraging guidance.
    - Use the knowledge pack under knowledge/ when relevant; treat references as perspective-setting, not medical authority.
    - Educational wellness coaching only — not diagnosis, prescription, or replacement for professional care.
    - When USER PROFILE is present, personalize to goals, constraints, and preferences.
  personas_dir: "personas/healthy_eating_advisors"

orchestrator:
  min_words_without_keywords: 6
  conversation_history_token_threshold: 4000
  specific_keywords:
    - "clean eating"
    - "whole food"
    - "processed"
    - "vegetable"
    - "veggie"
    - "fruit"
    - "superfood"
    - "enzyme"
    - "digestive"
    - "cookbook"
    - "book"
    - "sugar"
    - "salt"
    - "fat"
    - "juice"
    - "recipe"
    - "meal prep"
    - "lunch"
    - "snack"
    - "turmeric"
    - "ginger"
    - "wheatgrass"
    - "protein"
    - "diet"
    - "nutrition"
    - "organic"
    - "raw"
    - "fermented"
  clarification_questions:
    - "What would you like to change or improve about how you eat?"
    - "Do you prefer guidance on fruits, vegetables, superfoods, prep habits, enzymes, or books/resources?"
    - "Any allergies, dietary preferences, time limits, or kitchen constraints we should respect?"
    - "Are you looking for a simple next step, a short plan, or a deeper explanation?"
  clarification_suggestions:
    - "Ask Kitchen Coach what clean eating means for beginners"
    - "Ask Veggie Chef for an easy vegetable recipe"
    - "Ask Fruit Maven for fruit ideas and juice tips"
    - "Ask Superfoods Superman for one easy superfood to try"
    - "Ask Enzyme Explorer what digestive enzymes are"
    - "Ask Book Advisor for a starter healthy-eating book"

auth:
  algorithm: "HS256"
  token_expiry_minutes: 43200

mongodb:
  database_name: "healthy_eating_advisor"

llm:
  provider: "openai"
  gemini:
    model: "gemini-2.5-flash"
  ollama:
    model: "llama3.2:1b"
  vllm:
    api_url: ""
    api_key: ""
    api_username: "guest"
    model_id: ""
    neon_persona_orchestrator: "vanilla"
    neon_persona_advisors: "vanilla"
  openai:
    # Key comes from the OPENAI_API_KEY env var / HF Space secret (never committed).
    api_key: ""
    model: "gpt-5.4-mini"
    orchestrator_reasoning_effort: "low"
    persona_reasoning_effort: "none"
  resilient:
    race_timeout_seconds: 60

rag:
  embedding_model: "all-MiniLM-L6-v2"
  chroma_collection: "healthy_eating_documents"

tools:
  current_datetime:
    enabled: true
    default_timezone: "America/Denver"
  nutrition_calculator:
    enabled: false

voice:
  stt_endpoint: "https://whisper.neonaiservices.com"
  tts_endpoint: "https://coqui.neonaiservices.com"
